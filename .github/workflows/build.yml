name: build stable-edk2-ver ovmf
run-name: check-build
on:
  push:
    paths:
      - '.github/workflows/**'
  schedule:
    # min hour day mon wday
    - cron: '24 3 1,16,28 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      need: ${{ steps.compare.outputs.need }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
      - name: Find out the latest stable tag
        uses: oprypin/find-latest-tag@v1
        with:
          repository: 'tianocore/edk2'
          releases-only: false
          prefix: 'edk2-stable'
          sort-tags: true
        id: upstream
      - name: Compare latest tag with history
        id: compare
        env:
          LATEST: ${{ steps.upstream.outputs.tag }}
        run: |
          if [[ "$(cat tag)" != "$LATEST" ]]; then
            echo "need=y" >> "$GITHUB_OUTPUT"
          else
            echo "need=n" >> "$GITHUB_OUTPUT"
          fi
  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.need == 'y'
    steps:
      - name: Checkout Edk2 source tree
        uses: actions/checkout@v4
        with:
          repository: 'tianocore/edk2'
          submodules: recursive
          ref: ${{ needs.check.outputs.tag }}
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install essential compilers or softwares
        run: |
          sudo apt-get update
          sudo apt-get install make gcc g++ nasm iasl
          sudo apt-get install python3 python-is-python3 uuid-dev
      - name: Build BaseTools for Edk2 project
        run: |
          make -C BaseTools/Source/C -j$(nproc)
      # generates ${arch}.tar.gz
      # which contains like: /OVMF_X64_RELEASE/OVMF.fd
      - name: Build OVMF and pack by arches
        run: |
          for arch in X64; do
            for target in DEBUG RELEASE; do
              for secure in FALSE TRUE; do
                suffix=""
                [[ "${secure}" == TRUE ]] && suffix=".secboot"
                source edksetup.sh && build -p OvmfPkg/OvmfPkg${arch}.dsc \
                  -a "${arch}" -t GCC -b "${target}" -D SECURE_BOOT_ENABLE="${secure}"
                out=OVMF_${arch}_${target}${suffix}
                mkdir -p ${out}
                cp Build/Ovmf${arch}/${target}_GCC/FV/OVMF.fd ${out}/OVMF${suffix}.fd
                cp Build/Ovmf${arch}/${target}_GCC/FV/OVMF_CODE.fd ${out}/OVMF_CODE${suffix}.fd
                cp Build/Ovmf${arch}/${target}_GCC/FV/OVMF_VARS.fd ${out}/OVMF_VARS${suffix}.fd
                mkdir -p output
                tar czvf output/${out}.tar.gz ${out}
              done
            done
          done
      - name: Output build time and tag
        id: time
        run: |
          BUILT_AT="$(date +%s)"
          echo "time=${BUILT_AT}" >> "$GITHUB_OUTPUT"
          echo "Build time: ${BUILT_AT}"
          echo "Build tag: ${{ needs.check.outputs.tag }}"
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: meta
      - name: Write time and tag and push
        id: record
        env:
          TIME: ${{ steps.time.outputs.time }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          echo "$TIME" > meta/time
          echo "$TAG" > meta/tag
          git -C meta add time tag
          git -C meta diff --cached --quiet || git -C meta commit -m "Record build time and tag"
          git -C meta push
          echo "ref=$(git -C meta rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ steps.record.outputs.ref }}
          files: output/*.tar.gz
          fail_on_unmatched_files: true
