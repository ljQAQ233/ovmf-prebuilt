name: build stable-edk2-ver ovmf
run-name: check-build
on:
  push:
    paths:
      - '.github/workflows/**'
  schedule:
    # min hour day mon wday
    - cron: '24 3 1,16,28 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      need: ${{ steps.compare.outputs.need }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
      - name: Find out the latest stable tag
        uses: oprypin/find-latest-tag@v1
        with:
          repository: 'tianocore/edk2'
          releases-only: false
          prefix: 'edk2-stable'
          sort-tags: true
        id: upstream
      - name: Compare latest tag with history
        id: compare
        env:
          LATEST: ${{ steps.upstream.outputs.tag }}
        run: |
          if [[ "$(cat tag)" != "$LATEST" ]]; then
            echo "need=y" >> "$GITHUB_OUTPUT"
          else
            echo "need=n" >> "$GITHUB_OUTPUT"
          fi
  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.need == 'y'
    steps:
      - name: Checkout Edk2 source tree
        uses: actions/checkout@v4
        with:
          repository: 'tianocore/edk2'
          submodules: recursive
          ref: ${{ needs.check.outputs.tag }}
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install essential compilers or softwares
        run: |
          sudo apt-get update
          sudo apt-get install make gcc g++ nasm
          sudo apt-get install python3 python-is-python3 uuid-dev
      - name: Build BaseTools for Edk2 project
        run: |
          make -C BaseTools/Source/C -j$(nproc)
      # generates ${arch}.tar.gz
      # which contains like: /${arch}/OVMF_RELEASE_X64.fd
      - name: Build OVMF and pack by arches
        run: |
          for arch in X64; do
            [[ "${arch}" == "X64" ]] && a=x64
            for target in DEBUG RELEASE; do
              for secure in FALSE TRUE; do
                [[ "${secure}" == TRUE ]] && suffix=".secboot"
                source edksetup.sh && build -p OvmfPkg/OvmfPkg${arch}.dsc \
                  -a "${arch}" -t GCC -b "${target}" -D SECURE_BOOT_ENABLE="${secure}"
                mkdir -p ${a}
                cp Build/OvmfPkg/${target}_GCC/FV/OVMF.fd ${a}/OVMF_${target}_${arch}${suffix}.fd
                cp Build/OvmfPkg/${target}_GCC/FV/OVMF_CODE.fd ${a}/OVMF_${target}_${arch}${suffix}.code
                cp Build/OvmfPkg/${target}_GCC/FV/OVMF_VARS.fd ${a}/OVMF_${target}_${arch}${suffix}.vars
              done
            done
            mkdir -p output
            tar czvf output/${a}.tar.gz ${a}
          done
          exit 1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          files: output/*.tar.gz
          fail_on_unmatched_files: true
